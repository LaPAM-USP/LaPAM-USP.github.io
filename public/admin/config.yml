# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Content editor for the LaPAM site, served at https://lapam-usp.github.io/admin/
# Every save commits to `main`, which triggers the GitHub Pages deploy (~1–2 min).

app_title: LaPAM · Editor
site_url: https://lapam-usp.github.io/
logo_url: /img/LOGO%20LAPAM.png

backend:
  name: github
  repo: LaPAM-USP/LaPAM-USP.github.io
  branch: main
  # Only personal access tokens: "Sign In with GitHub" needs an OAuth server we don't run.
  auth_methods: [token]
  commit_messages:
    create: "content: cria {{slug}} via CMS"
    update: "content: atualiza {{slug}} via CMS"
    delete: "content: remove {{slug}} via CMS"
    uploadMedia: "content: envia {{path}} via CMS"
    deleteMedia: "content: remove {{path}} via CMS"

media_folder: public/img/team
public_folder: /img/team

media_libraries:
  default:
    config:
      max_file_size: 10000000
      # Uploaded photos are converted to WebP and resized, so any phone photo works.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 800
          height: 800

singletons:
  - name: team
    label: Equipe
    file: src/content/team.json
    format: json
    fields:
      - name: pi
        label: Coordenadora (PI)
        widget: object
        collapsed: true
        fields:
          - { name: name, label: Nome (PT), widget: string }
          - { name: nameEn, label: Nome (EN), widget: string }
          - { name: rolePt, label: Cargo (PT), widget: string }
          - { name: roleEn, label: Cargo (EN), widget: string }
          - { name: institutionPt, label: Instituição (PT), widget: string }
          - { name: institutionEn, label: Instituição (EN), widget: string }
          - { name: bioPt, label: Biografia (PT), widget: text }
          - { name: bioEn, label: Biografia (EN), widget: text }
          - { name: focusPt, label: Foco de pesquisa (PT), widget: string }
          - { name: focusEn, label: Foco de pesquisa (EN), widget: string }
          - { name: photo, label: Foto, widget: image, required: false }
          - { name: lattes, label: Lattes (URL), widget: string, required: false }
          - { name: orcid, label: ORCID (URL), widget: string, required: false }
          - { name: email, label: E-mail, widget: string, required: false }

      - name: members
        label: Membros
        label_singular: Membro
        widget: list
        hint: >-
          Quem concluiu o vínculo: marque "Ex-membro" (vai para a lista de ex-membros).
          Quem saiu no meio e não deve aparecer no site: apague o membro da lista (botão de remover do item).
        summary: "{{fields.name}} · {{fields.role}}{{fields.alumni | ternary(' · ex-membro', '')}}"
        fields:
          - { name: name, label: Nome, widget: string }
          - name: role
            label: Vínculo
            widget: select
            default: msc
            options:
              - { label: Pós-Doutorado, value: postdoc }
              - { label: Doutorado, value: phd }
              - { label: Mestrado, value: msc }
              - { label: Iniciação Científica, value: undergrad }
              - { label: Técnico(a), value: technician }
              - { label: Colaborador(a), value: collaborator }
          - name: alumni
            label: Ex-membro
            hint: Marque quando a pessoa concluir o vínculo. Ela passa para a lista de ex-membros (alumni). Para quem saiu no meio, apague o membro em vez de marcar.
            widget: boolean
            default: false
          - name: areas
            label: Áreas
            hint: Aparecem como etiquetas no card e servem de filtro. Pode marcar mais de uma.
            widget: select
            multiple: true
            required: false
            options:
              - { label: Laboratório, value: wetlab }
              - { label: Bioinformática, value: bioinformatics }
              - { label: Epidemiologia, value: epidemiology }
              - { label: One Health, value: onehealth }
          - { name: photo, label: Foto (opcional), widget: image, required: false }

  - name: publications
    label: Publicações
    file: src/content/publications-overrides.json
    format: json
    fields:
      - name: featured
        label: Destaques (DOI ou link)
        label_singular: Destaque
        widget: list
        required: false
        hint: >-
          A lista de publicações é importada automaticamente do ORCID/OpenAlex toda semana; aqui você só faz ajustes.
          Identifique cada publicação pelo DOI (ex.: 10.1099/mgen.0.001646) ou, se não tiver DOI, pelo link.
          Os destaques aparecem no topo da seção.
      - name: hidden
        label: Remover publicações (DOI ou link)
        label_singular: Publicação removida
        widget: list
        required: false
        hint: >-
          Publicações importadas automaticamente não podem ser apagadas na fonte; adicione aqui o DOI (ou link) para removê-las do site.
          O DOI aparece no link "DOI" de cada publicação no site. Para desfazer, apague o item desta lista.
          Publicações adicionadas manualmente (abaixo) são apagadas direto na lista delas.
      - name: edits
        label: Etiquetas e correções
        label_singular: Correção
        widget: list
        required: false
        summary: "{{fields.id}} · {{fields.tag}}"
        fields:
          - { name: id, label: DOI ou link, widget: string }
          - { name: tag, label: Etiqueta, widget: string, required: false, hint: "Ex.: BrSeqTB, WGS, MNT" }
          - { name: journal, label: Corrigir nome da revista, widget: string, required: false }
      - name: extra
        label: Publicações adicionais (manuais)
        label_singular: Publicação
        widget: list
        required: false
        summary: "{{fields.year}} · {{fields.title}}"
        fields:
          - { name: title, label: Título, widget: string }
          - { name: authors, label: Autores, widget: string }
          - { name: journal, label: Revista / veículo, widget: string, required: false }
          - { name: year, label: Ano, widget: number, value_type: int }
          - { name: url, label: Link, widget: string, required: false }
          - { name: tag, label: Etiqueta, widget: string, required: false }

collections:
  - name: news
    label: Notícias
    label_singular: Notícia
    description: Premiações, chamadas, eventos e outras novidades. As mais recentes aparecem primeiro no site.
    folder: src/content/news
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields: [date, title]
    media_folder: /public/img/news
    public_folder: /img/news
    fields:
      - { name: title, label: Título, widget: string }
      - { name: titleEn, label: "Título (EN, opcional)", widget: string, required: false }
      - { name: date, label: Data, widget: datetime, time_format: false, date_format: DD/MM/YYYY, format: YYYY-MM-DD }
      - name: category
        label: Categoria
        widget: select
        default: news
        options:
          - { label: Premiação, value: award }
          - { label: Chamada, value: call }
          - { label: Publicação, value: publication }
          - { label: Evento, value: event }
          - { label: Notícia, value: news }
      - { name: image, label: Imagem (opcional), widget: image, required: false }
      - { name: body, label: Texto, widget: markdown, required: false }
      - { name: bodyEn, label: "Texto (EN, opcional)", widget: markdown, required: false }
      - { name: link, label: Link externo (opcional), widget: string, required: false, hint: "Ex.: página do edital, matéria ou artigo" }
